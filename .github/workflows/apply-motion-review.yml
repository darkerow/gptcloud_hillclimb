name: Verify vehicle motion fix
on:
  push:
    branches: [feature/render-interpolation]
    paths: [.review/motion.patch]
permissions:
  contents: write
concurrency:
  group: motion-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/render-interpolation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and apply reviewed rendering changes
        run: |
          echo '83ea56c1f3249edbe40becfe61ed9075077494ab518cab691b42a1059165143d  .review/motion.patch' | sha256sum --check
          git apply --check .review/motion.patch
          git apply .review/motion.patch
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/motion_smoke.py
      - run: python tests/smoke.py
      - run: python tests/handling.py
      - name: Commit passing source to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs
          git commit -m 'Interpolate vehicle, wheel and world poses on the same clock as camera'
          git push origin HEAD:refs/heads/feature/render-interpolation
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-review-evidence
          path: test-results
          retention-days: 7
