name: Validate game
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/camera.test.mjs
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/smoke.py
      - run: python tests/camera_smoke.py
      - run: python tests/bridges_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-browser-screenshots
          path: test-results
          retention-days: 7
